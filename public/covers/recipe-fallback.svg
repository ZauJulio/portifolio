<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Recipe">
  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1b0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="rf-glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#c72c41" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c72c41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rf-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="rf-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#rf-bg)"/>
  <rect width="1200" height="400" fill="url(#rf-dots)"/>
  <rect width="1200" height="400" fill="url(#rf-glow)"/>

  <g transform="translate(600 196)" stroke-linecap="round" stroke-linejoin="round">
    <!-- steam -->
    <g stroke="#f47370" stroke-width="6" fill="none" opacity="0.85">
      <path d="M-34 -96 q 14 -16 0 -34"/>
      <path d="M2 -100 q 14 -16 0 -34"/>
      <path d="M38 -96 q 14 -16 0 -34"/>
    </g>
    <!-- soft glow behind the pot -->
    <g filter="url(#rf-soft)" opacity="0.5">
      <path d="M-86 -40 H86 l-12 118 a16 16 0 0 1 -16 14 H-58 a16 16 0 0 1 -16 -14 Z" stroke="#ee4540" stroke-width="6" fill="none"/>
    </g>
    <!-- lid -->
    <line x1="-92" y1="-40" x2="92" y2="-40" stroke="#ee4540" stroke-width="6"/>
    <circle cx="0" cy="-54" r="7" fill="#c72c41" stroke="#ee4540" stroke-width="4"/>
    <!-- handles -->
    <path d="M-86 -22 l-18 8" stroke="#ee4540" stroke-width="6" fill="none"/>
    <path d="M86 -22 l18 8" stroke="#ee4540" stroke-width="6" fill="none"/>
    <!-- pot body -->
    <path d="M-86 -28 H86 l-12 106 a16 16 0 0 1 -16 14 H-58 a16 16 0 0 1 -16 -14 Z" fill="#0b0608" stroke="#ee4540" stroke-width="5"/>
  </g>

  <text x="600" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#ffffff" fill-opacity="0.55">ZAU JULIO</text>
</svg>
