<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none" role="img" aria-label="Game">
  <defs>
    <linearGradient id="gf-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="gf-glow" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#2cc7b8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2cc7b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gf-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="gf-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#gf-bg)"/>
  <rect width="600" height="800" fill="url(#gf-dots)"/>
  <rect width="600" height="800" fill="url(#gf-glow)"/>

  <g transform="translate(300 380)">
    <rect x="-100" y="-56" width="200" height="112" rx="40" stroke="#40e0d0" stroke-width="6" filter="url(#gf-soft)" opacity="0.55"/>
    <rect x="-100" y="-56" width="200" height="112" rx="40" fill="#06121a" stroke="#40e0d0" stroke-width="5"/>
    <g stroke="#5ee9da" stroke-width="7" stroke-linecap="round">
      <line x1="-64" y1="-10" x2="-64" y2="10"/>
      <line x1="-74" y1="0" x2="-54" y2="0"/>
    </g>
    <g fill="#5ee9da">
      <circle cx="46" cy="-8" r="7"/>
      <circle cx="68" cy="14" r="7"/>
    </g>
  </g>
</svg>
