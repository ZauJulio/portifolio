<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Article">
  <defs>
    <linearGradient id="af-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1b0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="af-glow" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#c72c41" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c72c41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="af-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="af-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#af-bg)"/>
  <rect width="1200" height="400" fill="url(#af-dots)"/>
  <rect width="1200" height="400" fill="url(#af-glow)"/>

  <g transform="translate(600 184)">
    <!-- soft glow behind the document -->
    <rect x="-66" y="-88" width="132" height="176" rx="16" stroke="#ee4540" stroke-width="6" filter="url(#af-soft)" opacity="0.55"/>
    <!-- document -->
    <rect x="-66" y="-88" width="132" height="176" rx="16" fill="#0b0608" stroke="#ee4540" stroke-width="5"/>
    <!-- text lines -->
    <g stroke="#f47370" stroke-width="6" stroke-linecap="round">
      <line x1="-42" y1="-50" x2="20" y2="-50"/>
      <line x1="-42" y1="-22" x2="42" y2="-22"/>
      <line x1="-42" y1="6" x2="42" y2="6"/>
      <line x1="-42" y1="34" x2="42" y2="34"/>
      <line x1="-42" y1="62" x2="24" y2="62"/>
    </g>
  </g>

  <text x="600" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#ffffff" fill-opacity="0.55">ZAU JULIO</text>
</svg>
