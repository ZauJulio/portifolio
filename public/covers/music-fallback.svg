<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Music">
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1b0a12"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="mf-glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#c72c41" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c72c41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mf-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="mf-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#mf-bg)"/>
  <rect width="1200" height="400" fill="url(#mf-dots)"/>
  <rect width="1200" height="400" fill="url(#mf-glow)"/>

  <g transform="translate(600 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft glow behind the note -->
    <g filter="url(#mf-soft)" opacity="0.5">
      <path d="M-10 -84 L64 -104 V44" stroke="#ee4540" stroke-width="6" fill="none"/>
    </g>
    <!-- beamed eighth-note -->
    <path d="M-10 -84 L64 -104" stroke="#ee4540" stroke-width="12" fill="none"/>
    <path d="M-10 -84 V52" stroke="#ee4540" stroke-width="6" fill="none"/>
    <path d="M64 -104 V32" stroke="#ee4540" stroke-width="6" fill="none"/>
    <ellipse cx="-30" cy="56" rx="26" ry="19" fill="#0b0608" stroke="#ee4540" stroke-width="6" transform="rotate(-18 -30 56)"/>
    <ellipse cx="44" cy="36" rx="26" ry="19" fill="#0b0608" stroke="#ee4540" stroke-width="6" transform="rotate(-18 44 36)"/>
  </g>
</svg>
