<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Photography">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#08161b"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="pf-glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pf-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="pf-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#pf-bg)"/>
  <rect width="1200" height="400" fill="url(#pf-dots)"/>
  <rect width="1200" height="400" fill="url(#pf-glow)"/>

  <g transform="translate(600 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft glow behind the camera -->
    <g filter="url(#pf-soft)" opacity="0.5">
      <rect x="-104" y="-52" width="208" height="128" rx="20" stroke="#22d3ee" stroke-width="6" fill="none"/>
    </g>
    <!-- camera body -->
    <rect x="-104" y="-52" width="208" height="128" rx="20" fill="#05090b" stroke="#22d3ee" stroke-width="6"/>
    <!-- top plate / viewfinder hump -->
    <path d="M-56 -52 l16 -22 h48 l16 22" fill="#05090b" stroke="#22d3ee" stroke-width="6"/>
    <!-- lens -->
    <circle cx="0" cy="14" r="42" fill="#0b1418" stroke="#22d3ee" stroke-width="6"/>
    <circle cx="0" cy="14" r="20" fill="none" stroke="#22d3ee" stroke-width="6" opacity="0.85"/>
    <!-- shutter dot -->
    <circle cx="74" cy="-30" r="7" fill="#06b6d4"/>
  </g>
</svg>
